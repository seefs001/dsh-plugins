name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify client bundles match src/client*.js
        run: pnpm run build:clients:check
      - name: Lint
        run: pnpm run lint
      - name: Validate manifests and docs
        run: pnpm run validate
      - name: Test
        run: pnpm run test

- insert:
    - id: pi-tool-presentation
      name: dsh-pi-tools
      config:
        presentationOnly: true
    - id: preset-pi
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pi
        name: pi
        description: Pi 编程工具、QuickJS codemode 与按需 MCP，保留 DSH 会话和权限边界。
        order: 5
        plugins:
          - id: pi-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            config:
              interrupt: false
          - id: pi-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: pi-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: pi-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: pi-tools
            name: dsh-pi-tools
            config:
              mcpServers: [nowledge_mem]
              mcpExposure: codemode
              scopedTools: [subagent, subagent_fork, list_subagent_models, send_message, list_agents, wait_agent, ask_user_question]
              globalTools: [grok_search, openai_search]
          - id: pi-project-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: pi-compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: pi-compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: pi-command-compact
                name: '@deepseek-ai/dsh-command-compact'
